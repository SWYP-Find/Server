name: Java CI for Picke

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # 1. 빌드 속도를 획기적으로 줄이기 위해 그래들 캐시 적용

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 2. 테스트와 함께 빌드를 수행하여 Context Load 및 단위 테스트 무결성 통합 검증
      - name: Build and Test Verification
        run: ./gradlew build