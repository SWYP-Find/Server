# 1. 환경 설정 및 프로파일 동적 바인딩
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  # 2. 통합 데이터소스 및 엔티티 매핑 설정
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul

  # 3. spring.cloud 하위로 AWS 및 GCP 인프라 세팅 이동 (오류 해결 핵심)
  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET}
      region:
        static: ${AWS_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
    gcp:
      credentials:
        location: ${GCP_CREDENTIALS_PATH}

# 3-1. Firebase Admin SDK (FCM 푸시 알림 - Android)
firebase:
  credentials:
    location: ${FCM_CREDENTIALS_PATH}

# 3-2. APNs (다이렉트 APNs 푸시 알림 - iOS)
apns:
  enabled: ${APNS_ENABLED:false}
  credentials:
    location: ${APNS_CREDENTIALS_PATH:}
  key-id: ${APNS_KEY_ID:}
  team-id: ${APNS_TEAM_ID:${APPLE_TEAM_ID:}}
  bundle-id: ${APNS_BUNDLE_ID:}
  production: ${APNS_PRODUCTION:false}

# 4. 인증 및 보안 설정 (OAuth2, JWT)
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
  apple:
    team-id: ${APPLE_TEAM_ID}
    client-id: ${APPLE_CLIENT_ID}
    key-id: ${APPLE_KEY_ID}
    private-key: ${APPLE_PRIVATE_KEY}

# 5. 외부 API 설정 (AdMob, OpenAI, Fish Audio, ElevenLabs 등)
admob:
  app-id: ${ADMOB_APP_ID}
  reward:
    unit-id: ${ADMOB_REWARD_UNIT_ID}

openai:
  api-key: ${OPENAI_API_KEY}
  url: https://api.openai.com/v1/chat/completions
  model: gpt-4o-mini
  tts:
    url: https://api.openai.com/v1/audio/speech
    model: gpt-4o-mini-tts

fishaudio:
  api-key: ${FISHAUDIO_API_KEY}
  tts:
    url: https://api.fish.audio/v1/tts
  voice-id:
    a: ${FISHAUDIO_VOICE_A}
    b: ${FISHAUDIO_VOICE_B}
    user: ${FISHAUDIO_VOICE_USER}
    narrator: ${FISHAUDIO_VOICE_NARRATOR}

elevenlabs:
  api-key: ${ELEVENLABS_API_KEY}
  model: ${ELEVENLABS_MODEL}
  voice-id:
    a: ${ELEVENLABS_VOICE_A}
    b: ${ELEVENLABS_VOICE_B}
    user: ${ELEVENLABS_VOICE_USER}
    narrator: ${ELEVENLABS_VOICE_NARRATOR}

# 6. 기타 인프라 스트럭처 컴포넌트 세팅
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

picke:
  baseUrl: ${PICKE_BASE_URL:https://picke.store}
  s3:
    presigned-url:
      expiration-hours: 6
  local-storage:
    root: ${PICKE_LOCAL_STORAGE_ROOT:${java.io.tmpdir}/picke-local-storage}

media:
  ffmpeg:
    path: ${FFMPEG_PATH:ffmpeg}
  ffprobe:
    path: ${FFPROBE_PATH:ffprobe}